name: Validate Office artifacts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python monthly-close/validate_delivery.py
      - run: python validate.py
      - run: python prepare.py --dry-run
      - run: python -m py_compile prepare.py validate.py
      - run: python -m unittest test_prepare.py
  desktop-bundle:
    timeout-minutes: 8
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: integrations/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.13.6
      - run: python build.py
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: uv run --locked smoke_test.py
      - run: python -m unittest test_prepare.py
        working-directory: .
